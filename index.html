<!DOCTYPE html>
<html>
    <head>
        <title>Minecraft Create Wiki</title>
        <link rel="stylesheet" href="styles/index.css"
    </head>
    <body>
        <section id="hero">
            <img id="heading" src="assets/images/heading.webp" alt="">
            <img id="background" src="assets/images/home_background.jpeg" alt="">
        </section>
        <section id="sidebar">
            <nav id="page">
                <a id="home" href=".">
                    <span id="icon"></span>
                    <span id="name">Home</span>
                </a>
                <a id="wiki" href="wiki.html">
                    <span id="icon"></span>
                    <span id="name">Wiki</span>
                </a>
                <a id="design" href="design.html">
                    <span id="icon"></span>
                    <span id="name">Design</span>
                </a>
                <a id="library" href="library.html">
                    <span id="icon"></span>
                    <span id="name">Library</span>
                </a>
            </nav>
            <nav id="theme">
                <button role="theme" id="light" aria-selected="true">
                    <span id="icon"></span>
                    <span id="name">Light</span>
                </button>
                <button role="theme" id="dark" aria-selected="false">
                    <span id="icon"></span>
                    <span id="name">Dark</span>
                </button>
            </nav>
    </body>
</html>
